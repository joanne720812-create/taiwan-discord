name: 起漲股自動更新與5分K Discord

on:
  workflow_dispatch:
    inputs:
      mode:
        description: test驗證選股／scan盤後更新／monitor盤中監控／connection頻道連線
        type: choice
        default: test
        options: [test, scan, monitor, connection]
  schedule:
    - cron: '47 8 * * 1-5'
    - cron: '40 0 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: rising5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rising5:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STATE_DIR: state_rising5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝行情套件
        run: python -m pip install -r requirements_swing.txt
      - name: 恢復上次起漲名單與去重紀錄
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, name: 'rising5-state', per_page: 100});
            const artifact = result.data.artifacts.filter(a => !a.expired).sort((a,b) => b.id - a.id)[0];
            if (!artifact) return;
            const archive = await github.rest.actions.downloadArtifact({owner, repo, artifact_id: artifact.id, archive_format: 'zip'});
            require('fs').writeFileSync('rising5-state.zip', Buffer.from(archive.data));
      - name: 解開紀錄
        run: |
          mkdir -p state_rising5
          if [ -f rising5-state.zip ]; then
            unzip -o rising5-state.zip -d state_rising5
          fi
      - name: 自動選股與5分K通知
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '40 0 * * 1-5' && 'monitor' || 'scan') }}
          INTRADAY_WEBHOOK_URL: ${{ secrets.DISCORD_INTRADAY_WEBHOOK_URL }}
          RISING_WEBHOOK_URL: ${{ secrets.DISCORD_RISING_WEBHOOK_URL }}
        run: |
          python -m py_compile rising5_discord.py short_discord.py
          if [ "$MODE" = "monitor" ] || [ "$MODE" = "test" ]; then
            if [ -z "$INTRADAY_WEBHOOK_URL" ]; then
              echo "Missing intraday webhook"
              exit 1
            fi
            export DISCORD_WEBHOOK_URL="$INTRADAY_WEBHOOK_URL"
          else
            if [ -z "$RISING_WEBHOOK_URL" ]; then
              echo "Missing rising channel webhook"
              exit 1
            fi
            export DISCORD_WEBHOOK_URL="$RISING_WEBHOOK_URL"
          fi
          if [ "$MODE" = "connection" ]; then
            python - <<'PY'
          import json, os, urllib.request
          payload = {"content": "✅ 起漲股頻道連線測試成功\n之後的盤後起漲股名單會發送到這裡。做多／做空名單在「盤後做多跟做空」，盤中提醒在「🔔盤中5分K」。", "allowed_mentions": {"parse": []}}
          req = urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"] + "?wait=true", data=json.dumps(payload, ensure_ascii=False).encode(), headers={"Content-Type": "application/json", "User-Agent": "TaiwanStockDiscord/1.0"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as response:
              accepted = json.load(response)
          if accepted.get("channel_id") != "1556623631885271101":
              raise RuntimeError("Unexpected destination channel")
          print("Discord confirmed test in rising channel")
          PY
          else
            python rising5_discord.py "$MODE"
          fi
      - name: 保存自動更新名單與通知紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rising5-state
          path: state_rising5/*.json
          if-no-files-found: ignore
          retention-days: 14
