name: 台股做多做空5分K盤中推播

on:
  workflow_dispatch:
    inputs:
      mode:
        description: test名單驗證／scan盤後選股／monitor盤中監控／connection頻道連線／followup-test做空示範／followup-long-test做多示範
        type: choice
        default: test
        options: [test, scan, monitor, connection, followup-test, followup-long-test, marketdata]
      scan_date:
        description: 資料日期 YYYY-MM-DD；留空使用台灣今天
        type: string
        default: ''
  schedule:
    - cron: '40 9 * * 1-5'
    - cron: '55 0 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: short5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  short5:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STATE_DIR: state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝行情套件
        run: python -m pip install -r requirements_swing.txt
      - name: 恢復前次候選與通知紀錄
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, name: 'short5-state', per_page: 100});
            const artifact = result.data.artifacts.filter(a => !a.expired).sort((a,b) => b.id - a.id)[0];
            if (!artifact) {
              core.info('首次執行，尚無候選紀錄');
              return;
            }
            const archive = await github.rest.actions.downloadArtifact({owner, repo, artifact_id: artifact.id, archive_format: 'zip'});
            require('fs').writeFileSync('short5-state.zip', Buffer.from(archive.data));
      - name: 解開候選紀錄
        run: |
          mkdir -p state
          if [ -f short5-state.zip ]; then
            unzip -o short5-state.zip -d state
          fi
      - name: 執行選股或盤中監控
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '55 0 * * 1-5' && 'monitor' || 'scan') }}
          SCAN_DATE: ${{ inputs.scan_date }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_MARKETDATA_API_KEY }}
          INTRADAY_DATA_SOURCE: ${{ vars.INTRADAY_DATA_SOURCE }}
          INTRADAY_LONG_WEBHOOK_URL: ${{ secrets.DISCORD_INTRADAY_LONG_WEBHOOK_URL }}
          INTRADAY_SHORT_WEBHOOK_URL: ${{ secrets.DISCORD_INTRADAY_SHORT_WEBHOOK_URL }}
        run: |
          python -m py_compile short_discord.py stock_discord.py
          python -m unittest test_followup.py test_fugle_intraday.py -v
          if [ "$MODE" != "scan" ]; then
            if [ -z "$INTRADAY_LONG_WEBHOOK_URL" ] || [ -z "$INTRADAY_SHORT_WEBHOOK_URL" ]; then
              echo "Missing long/short webhook; stopping to prevent sending to the wrong channel"
              exit 1
            fi
            export DISCORD_SPLIT_INTRADAY=1
            export DISCORD_INTRADAY_LONG_WEBHOOK_URL="$INTRADAY_LONG_WEBHOOK_URL"
            export DISCORD_INTRADAY_SHORT_WEBHOOK_URL="$INTRADAY_SHORT_WEBHOOK_URL"
            export DISCORD_INTRADAY_LONG_CHANNEL_ID=1557765159970283611
            export DISCORD_INTRADAY_SHORT_CHANNEL_ID=1557765846519250945
          fi
          if [ "$MODE" = "marketdata" ]; then
            python - <<'PYTEST'
          import json, os, urllib.request, urllib.error
          import short_discord as bot
          for symbol in ("2484", "8042"):
              req = urllib.request.Request("https://api.fugle.tw/marketdata/v1.0/stock/intraday/candles/" + symbol + "?timeframe=5&sort=asc", headers={"X-API-KEY": os.environ["FUGLE_API_KEY"]})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError("Fugle HTTP status " + str(error.code)) from None
              print(json.dumps({k:payload.get(k) for k in ("symbol", "date", "timeframe", "exchange", "type")}, ensure_ascii=False))
              bars = payload.get("data", [])
              print("bars=" + str(len(bars)) + "; latest=" + str(bars[-1].get("date") if bars else None))
              if payload.get("symbol") != symbol or str(payload.get("timeframe")) != "5":
                  raise RuntimeError("Unexpected Fugle response metadata")
              import time
              time.sleep(1.1)
          print("Fugle API authentication and five-minute requests succeeded; no signal sent")
          PYTEST
            exit 0
          fi
          if [ "$MODE" = "monitor" ]; then
            if [ "$INTRADAY_DATA_SOURCE" = "fugle" ] && [ -z "$FUGLE_API_KEY" ]; then
              echo "Missing FUGLE_API_KEY; stopping before live monitoring"
              exit 1
            fi
            export INTRADAY_DATA_SOURCE="${INTRADAY_DATA_SOURCE:-yahoo}"
          fi
          if [ "$MODE" = "connection" ]; then
            python - <<'PY'
          import short_discord as bot
          for direction, label in (("long", "🔴 做多"), ("short", "🟢 做空")):
              bot.send_discord("✅ " + label + "盤中5分K分流連線成功\n此為連線測試，非交易訊號。", direction)
              bot.test_followup_cards(direction)
          print("Discord confirmed long/short destination channels and price headings")
          PY
            exit 0
          fi
          if [ "$MODE" = "test" ]; then
            python - <<'PY'
          import short_discord as bot
          from datetime import date
          report = bot.load("shortlist.json", {})
          if not report.get("asof"):
              raise RuntimeError("缺少候選名單，請先執行scan")
          asof = date.fromisoformat(report["asof"])
          longs = bot.long_candidates(asof)
          stocks = [{**item, "direction": "short"} for item in report.get("stocks", [])] + longs
          stocks = bot.attach_levels(stocks, asof)
          bot.send_monitor_cards(stocks, asof)
          print(f"CDP基準核對成功：{len(stocks)}檔，卡片已發送")
          print(f"候選驗證成功：資料日{asof}，做多{len(longs)}檔、做空{len(report.get('stocks', []))}檔；5分K")
          PY
          fi
          if [ "$MODE" = "scan" ] && [ -n "$SCAN_DATE" ]; then
            python short_discord.py scan --asof "$SCAN_DATE"
          else
            python short_discord.py "$MODE"
          fi
      - name: 保存候選與通知紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short5-state
          path: state/*.json
          if-no-files-found: ignore
          retention-days: 14

