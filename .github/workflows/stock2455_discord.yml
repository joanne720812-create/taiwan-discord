name: 全新2455明日做空盤前與5分K

on:
  workflow_dispatch:
    inputs:
      mode:
        description: prepare盤前策略／connection盤中設定確認／monitor僅10月8日監控
        type: choice
        default: prepare
        options: [prepare, connection, monitor]
  schedule:
    - cron: '50 0 8 10 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: stock2455-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stock2455:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      STATE_DIR: state_stock2455
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'monitor' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝行情套件
        run: python -m pip install -r requirements_swing.txt
      - name: 恢復全新策略與通知紀錄
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, name: 'stock2455-state', per_page: 100});
            const artifact = result.data.artifacts.filter(a => !a.expired).sort((a,b) => b.id - a.id)[0];
            if (!artifact) return;
            const archive = await github.rest.actions.downloadArtifact({owner, repo, artifact_id: artifact.id, archive_format: 'zip'});
            require('fs').writeFileSync('stock2455-state.zip', Buffer.from(archive.data));
      - name: 解開紀錄
        run: |
          mkdir -p state_stock2455
          if [ -f stock2455-state.zip ]; then
            unzip -o stock2455-state.zip -d state_stock2455
          fi
      - name: 全新盤前與5分K推播
        env:
          PLAN_WEBHOOK: ${{ secrets.DISCORD_RISING_WEBHOOK_URL }}
          MONITOR_WEBHOOK: ${{ secrets.DISCORD_INTRADAY_WEBHOOK_URL }}
        run: |
          python -m py_compile stock2455_discord.py short_discord.py
          python -m unittest test_stock2455.py -v
          if [ "$MODE" = "prepare" ]; then
            export DISCORD_WEBHOOK_URL="$PLAN_WEBHOOK"
          else
            export DISCORD_WEBHOOK_URL="$MONITOR_WEBHOOK"
          fi
          python stock2455_discord.py "$MODE"
      - name: 失敗通知
        if: failure()
        env:
          PLAN_WEBHOOK: ${{ secrets.DISCORD_RISING_WEBHOOK_URL }}
          MONITOR_WEBHOOK: ${{ secrets.DISCORD_INTRADAY_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import stock2455_discord as task
          from short_discord import send_discord
          plan = os.environ['MODE'] == 'prepare'
          os.environ['DISCORD_WEBHOOK_URL'] = os.environ['PLAN_WEBHOOK' if plan else 'MONITOR_WEBHOOK']
          try:
              task.verify_channel('1556623631885271101' if plan else '1556619339573231726')
              send_discord('⚠️ 全新2455策略或5分K監控執行失敗，未確認完成。請查看GitHub紀錄；沒有通知不代表沒有訊號。')
          except Exception:
              print('Failure notice delivery not confirmed; see Actions')
          PY
      - name: 保存全新策略與通知紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock2455-state
          path: state_stock2455/*.json
          if-no-files-found: ignore
          retention-days: 14
