name: RSI強勢觀察每日與開盤5分K

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview只驗證資料／connection連線測試／latest最新名單／scan盤後／monitor開盤監控
        type: choice
        default: preview
        options: [preview, connection, latest, scan, monitor]
  schedule:
    - cron: '25 0 * * 1-5'
    - cron: '15 9 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: rsi10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rsi10:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      STATE_DIR: state_rsi10
      DISCORD_RSI_WEBHOOK_URL: ${{ secrets.DISCORD_RSI_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝行情套件
        run: python -m pip install -r requirements_swing.txt
      - name: 檢查策略邊界與語法
        run: |
          python -m py_compile rsi10_discord.py
          python -m unittest test_rsi10 -v
      - name: 恢復RSI通知去重紀錄
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listArtifactsForRepo({owner, repo, name: 'rsi10-state', per_page: 100});
            const artifact = result.data.artifacts.filter(a => !a.expired).sort((a,b) => b.id-a.id)[0];
            if (!artifact) return;
            const archive = await github.rest.actions.downloadArtifact({owner, repo, artifact_id: artifact.id, archive_format: 'zip'});
            require('fs').writeFileSync('rsi10-state.zip', Buffer.from(archive.data));
      - name: 解開RSI紀錄
        run: |
          mkdir -p state_rsi10
          if [ -f rsi10-state.zip ]; then
            unzip -o rsi10-state.zip -d state_rsi10
          fi
      - name: 執行RSI選股與開盤觀察
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '25 0 * * 1-5' && 'monitor' || 'scan') }}
        run: |
          if [ "$MODE" != "preview" ] && [ -z "$DISCORD_RSI_WEBHOOK_URL" ]; then
            echo "RSI webhook is not configured; no messages sent"
            exit 1
          fi
          python rsi10_discord.py "$MODE"
      - name: 保存RSI名單與去重紀錄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi10-state
          path: state_rsi10/*.json
          if-no-files-found: ignore
          retention-days: 14
